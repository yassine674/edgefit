<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>edgefit</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/i18n.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="signal" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#7ea6ff"/><stop offset="1" stop-color="#7ea6ff"/></linearGradient>
      <linearGradient id="signal-aire" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7ea6ff" stop-opacity="0.22"/><stop offset="1" stop-color="#7ea6ff" stop-opacity="0"/></linearGradient>
      <symbol id="i-decouvrir" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></g></symbol>
      <symbol id="i-modeles" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g></symbol>
      <symbol id="i-bancs" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/></g></symbol>
      <symbol id="i-materiel" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></g></symbol>
      <symbol id="i-reglages" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></g></symbol>
      <symbol id="i-comparer" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v16M16 4v16"/><path d="M4 8l4-4 4 4M12 16l4 4 4-4"/></g></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 16l-5-5-8.5 8.5"/></g></symbol>
      <symbol id="i-micro" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></g></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-envoyer" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-mesures" viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-ok" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-juste" viewBox="0 0 24 24"><path d="M12 7v6m0 4h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-non" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <aside class="barre" id="barre">
      <div class="marque"><span class="logo" aria-hidden="true"></span>edgefit</div>
      <div class="bloc-carte">
        <span class="nom-carte" id="nom-carte">…</span>
        <div class="barre-ram" id="barre-ram" aria-hidden="true">
          <span class="sys" id="ram-sys"></span><span class="mod" id="ram-mod"></span>
          <span class="fantome" id="fantome" hidden></span>
        </div>
        <div class="chiffres-ram"><span id="ram-texte"></span><span id="ram-fantome"></span></div>
        <div class="etat-ollama"><span class="point" id="point-ollama"></span><span id="texte-ollama">Ollama…</span></div>
      </div>
      <button type="button" class="bouton-nouveau" id="nouvelle-conv"><svg width="16" height="16"><use href="#i-plus"/></svg><span data-t="nouvelle_conv"></span></button>
      <nav class="conversations" id="liste-conv" aria-label="Conversations"></nav>
      <nav class="nav" aria-label="Navigation">
        <a href="#/decouvrir" data-groupe="modeles"><svg><use href="#i-modeles"/></svg><span data-t="nav_g_modeles"></span><span class="compte" id="compte-modeles"></span></a>
        <a href="#/images" data-groupe="studio"><svg><use href="#i-image"/></svg><span data-t="nav_g_studio"></span></a>
        <a href="#/bancs" data-groupe="mesurer"><svg><use href="#i-bancs"/></svg><span data-t="nav_g_mesurer"></span></a>
        <a href="#/materiel" data-groupe="carte"><svg><use href="#i-materiel"/></svg><span data-t="nav_g_carte"></span></a>
      </nav>
      <div class="pied-barre">
        <button type="button" class="lien-discret" id="bouton-langue">EN</button>
        <span class="aide" id="version-app">edgefit</span>
      </div>
    </aside>

    <div class="contenu">
      <header class="entete-mobile">
        <button type="button" class="bouton petit" id="ouvrir-barre" aria-controls="barre" aria-expanded="false"><svg><use href="#i-menu"/></svg><span class="sr-only">Menu</span></button>
        <span class="titre" id="titre-mobile">edgefit</span>
      </header>
      <nav class="onglets" id="onglets" hidden></nav>
      <div class="banniere" id="banniere" hidden role="status"></div>
      <main id="page"></main>
    </div>
  </div>

  <dialog id="dialogue">
    <h2 id="dialogue-titre"></h2>
    <p id="dialogue-texte"></p>
    <div class="acts">
      <button type="button" class="bouton" id="dialogue-non"></button>
      <button type="button" class="bouton principal" id="dialogue-oui"></button>
    </div>
  </dialog>
</body>
</html>
